name: CI Pipeline
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance:
        type: boolean
        default: false
        description: Run the longer performance and stress suites
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate (${{ matrix.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [quality, integration, build]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: convey_test
          POSTGRES_PASSWORD: convey_test
          POSTGRES_DB: convey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convey_test -d convey_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      CONVEY_REQUIRE_AUTH: 'false'
      POSTGRES_DB: convey_test
      DATABASE_URL: postgres://convey_test:convey_test@localhost:5432/convey_test
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: convey
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/validate
        with:
          phase: ${{ matrix.phase }}
      - name: Optional performance suite
        if: matrix.phase == 'integration' && inputs.performance == true
        run: bun run test:server:performance
