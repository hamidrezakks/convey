name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint, Format & TypeScript Typecheck
  # --------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Lint & Format Check
        run: bun run biome:check

      - name: Run TypeScript Monorepo Typecheck
        run: bun run typecheck

  # --------------------------------------------------------------------------
  # 2. Automated Test Suite
  # --------------------------------------------------------------------------
  test-suite:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Monorepo Test Suites
        run: bun test

  # --------------------------------------------------------------------------
  # 3. SDK Build & Artifact Verification
  # --------------------------------------------------------------------------
  build-sdk:
    name: Build & Verify @convey/sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK Artifacts (ESM, CJS, Types)
        run: bun --filter @convey/sdk build

      - name: Verify Build Artifacts Integrity
        run: |
          test -f packages/sdk/dist/index.js || { echo "Missing index.js"; exit 1; }
          test -f packages/sdk/dist/index.cjs || { echo "Missing index.cjs"; exit 1; }
          test -f packages/sdk/dist/index.d.ts || { echo "Missing index.d.ts"; exit 1; }
          test -f packages/sdk/dist/index.d.cts || { echo "Missing index.d.cts"; exit 1; }
          echo "All @convey/sdk build artifacts verified!"

  # --------------------------------------------------------------------------
  # 4. Web Console & Documentation Build Verification
  # --------------------------------------------------------------------------
  build-apps:
    name: Build Web Console & Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Console (@convey/web)
        run: bun --filter @convey/web build

      - name: Build Documentation Website (@convey/website)
        run: bun --filter @convey/website build

  # --------------------------------------------------------------------------
  # 5. Docker Build Verification
  # --------------------------------------------------------------------------
  docker-validate:
    name: Validate Docker Build Targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image Target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: false
          cache-from: type=gha,scope=server-build
          cache-to: type=gha,mode=max,scope=server-build

      - name: Build Web Console Docker Image Target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: web
          push: false
          cache-from: type=gha,scope=web-build
          cache-to: type=gha,mode=max,scope=web-build
