name: Release & Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic Version Bump Type'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease
      custom_version:
        description: 'Override Custom Version (e.g. 1.2.0 or 1.2.0-beta.1)'
        required: false
        type: string
        default: ''
      prerelease_tag:
        description: 'Prerelease Tag Identifier (e.g. beta, rc, alpha)'
        required: false
        type: string
        default: 'beta'
      dry_run:
        description: 'Dry Run Mode (Simulate without committing, tagging, or publishing)'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Version Analysis, Tagging & GitHub Release
  # --------------------------------------------------------------------------
  prepare-release:
    name: Validate release candidate and create tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: convey_test
          POSTGRES_PASSWORD: convey_test
          POSTGRES_DB: convey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convey_test -d convey_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      CONVEY_REQUIRE_AUTH: 'false'
      POSTGRES_DB: convey_test
      DATABASE_URL: postgres://convey_test:convey_test@localhost:5432/convey_test
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: convey
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
      changelog: ${{ steps.bump.outputs.changelog }}
      dry_run: ${{ steps.evaluate-dryrun.outputs.dry_run }}
    steps:
      - name: Checkout repository with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Evaluate Dry Run Flag
        id: evaluate-dryrun
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

      - name: Compute release candidate
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'auto' }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag || 'beta' }}
        run: |
          args=(--github-output "--bump=$BUMP_TYPE" "--prerelease-tag=$PRERELEASE_TAG")
          if [ -n "$CUSTOM_VERSION" ]; then args+=("--version=$CUSTOM_VERSION"); fi
          bun run scripts/release-bump.ts "${args[@]}"

      - name: Prepare exact candidate revision locally
        if: steps.bump.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          bun install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock packages/*/package.json apps/*/package.json packages/sdk-py/pyproject.toml packages/sdk-py/convey/__init__.py packages/sdk-py/convey/http.py packages/sdk-go/client_options.go CHANGELOG.md
          git commit -m "chore(release): bump version to $RELEASE_TAG [skip ci]"

      - name: Validate the exact candidate, including dry runs
        if: steps.bump.outputs.should_release == 'true'
        uses: ./.github/actions/validate

      - name: Tag and publish the validated revision
        if: steps.bump.outputs.should_release == 'true' && steps.evaluate-dryrun.outputs.dry_run == 'false'
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git diff --exit-code
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git tag -a "packages/sdk-go/$RELEASE_TAG" -m "Go SDK $RELEASE_TAG"
          git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG" "refs/tags/packages/sdk-go/$RELEASE_TAG"

      - name: Publish Official GitHub Release
        if: steps.bump.outputs.should_release == 'true' && steps.evaluate-dryrun.outputs.dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: Release ${{ steps.bump.outputs.tag }}
          body: ${{ steps.bump.outputs.changelog }}
          prerelease: ${{ steps.bump.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 2. NPM Package Release (@convey/sdk)
  # --------------------------------------------------------------------------
  publish-npm:
    name: Publish @convey/sdk to NPM
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' && needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Setup Node.js & NPM Registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build @convey/sdk Distribution
        run: bun --filter @convey/sdk build

      - name: Publish @convey/sdk with Provenance
        run: |
          cd packages/sdk
          DIST_TAG="latest"
          if [ "${{ needs.prepare-release.outputs.is_prerelease }}" == "true" ]; then
            DIST_TAG="beta"
          fi
          echo "Publishing @convey/sdk@${{ needs.prepare-release.outputs.version }} with tag '$DIST_TAG'..."
          npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --------------------------------------------------------------------------
  # 3. PyPI Package Release (convey-sdk)
  # --------------------------------------------------------------------------
  publish-pypi:
    name: Publish convey-sdk to PyPI
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' && needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Install Build Tooling
        run: python3 -m pip install --upgrade build hatchling twine

      - name: Build Python Distribution (Wheel & Sdist)
        run: |
          cd packages/sdk-py
          python3 -m build

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-py/dist/
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  # --------------------------------------------------------------------------
  # 4. Go Module Release Verification
  # --------------------------------------------------------------------------
  publish-go:
    name: Verify & Index Go SDK Module
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' && needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      - name: Verify Go Module Build & Tests
        run: |
          cd packages/sdk-go
          go vet ./...
          go test -v -race ./...

      - name: Trigger Go Proxy Indexing
        run: |
          GOPROXY=https://proxy.golang.org go list -m github.com/hamidrezakks/convey/packages/sdk-go@${{ needs.prepare-release.outputs.tag }} || echo "Go proxy will index on first go get invocation"

  # --------------------------------------------------------------------------
  # 5. Docker Container Release (GHCR Multi-Arch)
  # --------------------------------------------------------------------------
  publish-docker:
    name: Build & Push Docker Image (${{ matrix.image }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' && needs.prepare-release.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: convey-server
            target: server
            description: "Convey Core Planetary Communication Service Engine & Workers"
          - image: convey-plugins
            target: plugins
            description: "Convey preferences and inbox service"
          - image: convey-web
            target: web
            description: "Convey Admin Mission Control & Real-time Telemetry Dashboard"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up QEMU (Multi-Architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & SemVer Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare-release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare-release.outputs.is_prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and Push Multi-Arch Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-release

      - name: Generate Build Attestation (Provenance & SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true
