# ==============================================================================
# 🗄️ CONVEY INFRASTRUCTURE RESOURCES DOCKER COMPOSE
# PostgreSQL 18 (Partitioned Ledger) + DragonflyDB (BullMQ & Idempotency)
# ==============================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: convey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db-convey}
      POSTGRES_USER: ${POSTGRES_USER:-convey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - convey_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convey} -d ${POSTGRES_DB:-db-convey}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - convey-network

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: convey-dragonfly
    restart: unless-stopped
    command: ["dragonfly", "--cache_mode=true", "--keys_output_limit=10000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - convey_dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      convey-network:
        aliases:
          - dragonfly
          - redis

networks:
  convey-network:
    name: convey-network
    driver: bridge

volumes:
  convey_postgres_data:
    name: convey_postgres_data
  convey_dragonfly_data:
    name: convey_dragonfly_data
