# ==============================================================================
# ⚡ CONVEY APPLICATION SERVICE DOCKER COMPOSE
# Convey High-Throughput API Gateway, Worker Engine & Mission Control Console
# ==============================================================================

services:
  convey-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: convey-server:latest
    container_name: convey-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONVEY_REQUIRE_AUTH: ${CONVEY_REQUIRE_AUTH:-false}
      POSTGRES_DB: ${POSTGRES_DB:-db-convey}
      DATABASE_URL: ${DATABASE_URL:-postgres://convey:convey@convey-postgres:5432/db-convey}
      REDIS_URL: ${REDIS_URL:-redis://convey-redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-convey}
      BULLMQ_SCHEDULING_HORIZON_SECONDS: ${BULLMQ_SCHEDULING_HORIZON_SECONDS:-1800}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # Optional provider configs (passed through from .env if set)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - convey-network

  convey-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: convey-web:latest
    container_name: convey-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://convey-server:3000}
    networks:
      - convey-network

networks:
  convey-network:
    name: convey-network
    external: true
