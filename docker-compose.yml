# ==============================================================================
# ⚡ CONVEY UNIFIED DOCKER COMPOSE
# Complete stack: PostgreSQL 18 + DragonflyDB + Convey Server + Mission Control Web + Mock Gateway
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 18 (Monthly Range-Partitioned Ledger)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: convey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db-convey}
      POSTGRES_USER: ${POSTGRES_USER:-convey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - convey_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convey} -d ${POSTGRES_DB:-db-convey}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - convey-network

  # ----------------------------------------------------------------------------
  # 2. DragonflyDB (Multi-Threaded In-Memory Engine, BullMQ & 1-RTT Locks)
  # ----------------------------------------------------------------------------
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: convey-dragonfly
    restart: unless-stopped
    command: ["dragonfly", "--cache_mode=true", "--keys_output_limit=10000"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - convey_dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      convey-network:
        aliases:
          - dragonfly
          - redis

  # ----------------------------------------------------------------------------
  # 3. Convey Provider Mock Gateway (Universal Simulator with Domain Aliases)
  # ----------------------------------------------------------------------------
  mock-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-server
    image: convey-mock-server:latest
    container_name: convey-mock-gateway
    restart: unless-stopped
    ports:
      - "${MOCK_GATEWAY_PORT:-4000}:4000"
    environment:
      PROVIDER_ID: all
      PORT: 4000
      WEBHOOK_URL: ${WEBHOOK_URL:-http://convey-server:3000/v1/webhooks/providers}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      convey-network:
        aliases:
          - api.resend.com
          - api.sendgrid.com
          - api.twilio.com
          - slack.com
          - fcm.googleapis.com
          - email.us-east-1.amazonaws.com
          - events.pagerduty.com
          - api.mailgun.net
          - api.postmarkapp.com
          - api.brevo.com
          - api.infobip.com
          - api.plivo.com
          - api.telnyx.com
          - api.bandwidth.com
          - discord.com
          - api.telegram.org
          - api.push.apple.com
          - api.opsgenie.com
          - mock-gateway

  # ----------------------------------------------------------------------------
  # 4. Convey Server (Elysia HTTP Gateway & Autonomous Worker Engine)
  # ----------------------------------------------------------------------------
  convey-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: convey-server:latest
    container_name: convey-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-gateway:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONVEY_REQUIRE_AUTH: ${CONVEY_REQUIRE_AUTH:-true}
      POSTGRES_DB: ${POSTGRES_DB:-db-convey}
      DATABASE_URL: ${DATABASE_URL:-postgres://convey:convey@postgres:5432/db-convey}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-convey}
      BULLMQ_SCHEDULING_HORIZON_SECONDS: ${BULLMQ_SCHEDULING_HORIZON_SECONDS:-1800}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # Realistic Mock Provider Credentials
      RESEND_API_KEY: ${RESEND_API_KEY:-re_mock_prod_key_1234567890}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@convey.dev}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-SG.mock_sendgrid_key_1234567890}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-notifications@convey.dev}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-ACmockaccount1234567890abcdef}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-mock_twilio_auth_token_secret}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+15550192834}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-mock-slack-bot-token-12345}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL:-general}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-mock_pagerduty_routing_key_123}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - convey-network

  # ----------------------------------------------------------------------------
  # 5. Mission Control Web Console (React 19 + Base UI)
  # ----------------------------------------------------------------------------
  convey-plugins:
    build:
      context: .
      dockerfile: Dockerfile
      target: plugins
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://convey:convey@postgres:5432/db-convey}
      CONVEY_API_INTERNAL_URL: http://convey-server:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks:
      - convey-network

  convey-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: convey-web:latest
    container_name: convey-web
    restart: unless-stopped
    depends_on:
      convey-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      CONVEY_API_INTERNAL_URL: http://convey-server:3000
      CONVEY_PLUGINS_INTERNAL_URL: http://convey-plugins:3001
    networks:
      - convey-network

networks:
  convey-network:
    name: convey-network
    driver: bridge

volumes:
  convey_postgres_data:
    name: convey_postgres_data
  convey_dragonfly_data:
    name: convey_dragonfly_data
