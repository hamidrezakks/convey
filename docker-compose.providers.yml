# ==============================================================================
# ⚡ CONVEY DISCRETE PROVIDER MOCK SIMULATOR COMPOSE TOPOLOGY
# Multi-container realistic provider simulation topology for production testing
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 0. Universal Mock Gateway (Default Port 4000)
  # ----------------------------------------------------------------------------
  mock-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-server
    image: convey-mock-server:latest
    container_name: convey-mock-gateway
    restart: unless-stopped
    ports:
      - "${MOCK_GATEWAY_PORT:-4000}:4000"
    environment:
      PROVIDER_ID: all
      PORT: 4000
      WEBHOOK_URL: ${WEBHOOK_URL:-http://convey-server:3000/v1/webhooks/providers}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - convey-network

  # ----------------------------------------------------------------------------
  # 1. Discrete Email Provider Containers
  # ----------------------------------------------------------------------------
  mock-resend:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-server
    image: convey-mock-server:latest
    container_name: convey-mock-resend
    restart: unless-stopped
    ports:
      - "${MOCK_RESEND_PORT:-4001}:4001"
    environment:
      PROVIDER_ID: resend
      PORT: 4001
      WEBHOOK_URL: ${WEBHOOK_URL:-http://convey-server:3000/v1/webhooks/providers}
    networks:
      convey-network:
        aliases:
          - api.resend.com
          - mock-resend

  mock-sendgrid:
