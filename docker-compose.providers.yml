# ==============================================================================
# ⚡ CONVEY DISCRETE PROVIDER MOCK SIMULATOR COMPOSE TOPOLOGY (ALL 88 PROVIDERS)
# Complete multi-container isolated simulation stack for all 88 Convey providers
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 0. Universal Mock Gateway (Port 4000)
  # ----------------------------------------------------------------------------
  mock-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-server
    image: convey-mock-server:latest
    container_name: convey-mock-gateway
    restart: unless-stopped
    ports:
      - "${MOCK_GATEWAY_PORT:-4000}:4000"
    environment:
      PROVIDER_ID: all
      PORT: 4000
      WEBHOOK_URL: ${WEBHOOK_URL:-http://convey-server:3000/v1/webhooks/providers}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - convey-network

